name: Test fail-on-warning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          report-json: tests/fixtures/eslint-warnings.json
          fail-on-warning: 'true'
      - name: Assert step failed due to warnings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERRORS: ${{ steps.action.outputs.errorCount }}
          WARNINGS: ${{ steps.action.outputs.warningCount }}
        run: |
          echo "outcome: $OUTCOME"
          echo "errorCount: $ERRORS"
          echo "warningCount: $WARNINGS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' with fail-on-warning"; exit 1
          fi
          if [ "$ERRORS" != "0" ]; then echo "FAIL: expected errorCount 0"; exit 1; fi
          if [ "$WARNINGS" != "2" ]; then echo "FAIL: expected warningCount 2"; exit 1; fi
          echo "PASS"
