name: Test report with errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          report-json: tests/fixtures/eslint-errors.json
      - name: Assert outputs and failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERRORS: ${{ steps.action.outputs.errorCount }}
          WARNINGS: ${{ steps.action.outputs.warningCount }}
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "errorCount: $ERRORS"
          echo "warningCount: $WARNINGS"
          echo "summary: $SUMMARY"
          # fail-on-error defaults to true, so the step must fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' with ESLint errors"; exit 1
          fi
          if [ "$ERRORS" != "2" ]; then echo "FAIL: expected errorCount 2"; exit 1; fi
          if [ "$WARNINGS" != "1" ]; then echo "FAIL: expected warningCount 1"; exit 1; fi
          if [ "$SUMMARY" != "2 ESLint error(s) and 1 ESLint warning(s) found" ]; then
            echo "FAIL: unexpected summary"; exit 1
          fi
          echo "PASS"
