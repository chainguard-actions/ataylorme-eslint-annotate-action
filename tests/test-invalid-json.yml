name: Test invalid JSON report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          report-json: tests/fixtures/eslint-invalid.json
      - name: Assert action failed without outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERRORS: ${{ steps.action.outputs.errorCount }}
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "errorCount: $ERRORS"
          echo "summary: $SUMMARY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid JSON"; exit 1
          fi
          if [ -n "$ERRORS" ] || [ -n "$SUMMARY" ]; then
            echo "FAIL: outputs should not be set for invalid JSON"; exit 1
          fi
          echo "PASS"
