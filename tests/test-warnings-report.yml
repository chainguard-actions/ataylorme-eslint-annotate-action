name: Test warnings-only report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          report-json: tests/fixtures/eslint-warnings.json
          neutral-on-warning: 'true'
          markdown-report-on-step-summary: 'true'
      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERRORS: ${{ steps.action.outputs.errorCount }}
          WARNINGS: ${{ steps.action.outputs.warningCount }}
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "errorCount: $ERRORS"
          echo "warningCount: $WARNINGS"
          echo "summary: $SUMMARY"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          if [ "$ERRORS" != "0" ]; then echo "FAIL: expected errorCount 0"; exit 1; fi
          if [ "$WARNINGS" != "2" ]; then echo "FAIL: expected warningCount 2"; exit 1; fi
          if [ "$SUMMARY" != "0 ESLint error(s) and 2 ESLint warning(s) found" ]; then
            echo "FAIL: unexpected summary"; exit 1
          fi
          echo "PASS"
