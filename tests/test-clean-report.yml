name: Test clean ESLint report (no errors or warnings)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy clean ESLint report to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/eslint-clean.json" "$GITHUB_WORKSPACE/eslint_report.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          report-json: eslint_report.json
          fail-on-error: 'true'
          fail-on-warning: 'false'
          only-pr-files: 'false'
          check-name: 'ESLint Clean Report Test'

      - name: Assert action ran (clean report should succeed or fail gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with clean ESLint report"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for GitHub Checks API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
